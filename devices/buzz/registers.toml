# Imported from BUZZ_DECODE.h. Review the sources and grades, then maintain by hand.
unit = "buzz"
prefix = "BUZZ"
title = "VPro (Odyssey) \"Buzz\" graphics ASIC: command and image"
doc = "Command opcodes and the image, copy, pixel-mode, texture-level and sampler words of the Odyssey geometry and pixel engine's command stream."
from = "odsy binary analysis of the shipped GL library and kernel command senders"
public_from = ["odsy binary analysis"]

[c]
legacy_header = "BUZZ_DECODE.h"
legacy_guard = "BUZZ_DECODE_H"

