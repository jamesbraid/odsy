# Imported from ODSY_DECODE.h. Review the sources and grades, then maintain by hand.
unit = "board"
prefix = "ODSY"
title = "VPro (Odyssey) graphics board: widget identity, board"
doc = "Board identity on the crossbar, the register positions of the board window, and the identity, strap and memory-configuration words."
from = "odsy binary analysis of the shipped kernel board routines"
public_from = ["odsy binary analysis"]

[c]
legacy_header = "ODSY_DECODE.h"
legacy_guard = "ODSY_DECODE_H"

[words.HOST_FLOW_MODE]
width = 32
grade = "established"

[words.HOST_FLOW_MODE.fields]
owner_cpu1 = { bits = [13, 12], grade = "established" }
owner_cpu0 = { bits = [11, 10], grade = "established" }
attach_cpu1 = { bits = [9, 9], grade = "established" }
attach_cpu0 = { bits = [8, 8], grade = "established" }

[[words.HOST_FLOW_MODE.tests]]
value = 0x1200
kind = "example"
expect = { attach_cpu0 = 0, attach_cpu1 = 1, owner_cpu0 = 0, owner_cpu1 = 1 }

[words.MASTER_ID]
width = 32
grade = "established"

[words.MASTER_ID.fields]
bit24 = { bits = [24, 24], grade = "established" }
master = { bits = [23, 20], grade = "established" }
bit18 = { bits = [18, 18], grade = "established" }
code = { bits = [15, 0], grade = "established" }

[[words.MASTER_ID.tests]]
value = 0x1340012
kind = "example"
expect = { code = 18, bit18 = 1, master = 3, bit24 = 1 }

[words.SDRAM_CFG]
width = 32
grade = "inferred"

[words.SDRAM_CFG.fields]
host_id = { bits = [22, 19], grade = "established" }
enable = { bits = [8, 8], grade = "inferred" }
reset = { bits = [5, 5], grade = "inferred" }

[words.SDRAM_CFG.fields.size]
bits = [4, 3]
grade = "established"

[words.SDRAM_CFG.fields.size.enums]
mb32 = { value = 0, grade = "established" }
mb64 = { value = 1, grade = "established" }
mb128 = { value = 2, grade = "established" }

[words.SDRAM_CFG.fields.banks]
bits = [2, 2]
grade = "established"

[words.SDRAM_CFG.fields.banks.enums]
two = { value = 0, grade = "established" }
four = { value = 1, grade = "established" }

[words.SDRAM_CFG.fields.cas]
bits = [1, 1]
grade = "established"

[words.SDRAM_CFG.fields.cas.enums]
cas3 = { value = 0, grade = "established" }
cas2 = { value = 1, grade = "established" }

[words.STATS_CTL]
width = 32
grade = "established"

[words.STATS_CTL.fields]
fixed_top = { bits = [31, 31], grade = "established" }
fixed_mid = { bits = [27, 27], grade = "established" }
select = { bits = [10, 8], grade = "established" }
flag_c = { bits = [6, 6], grade = "established" }
flag_b = { bits = [5, 5], grade = "established" }
flag_a = { bits = [4, 4], grade = "established" }
size_exp = { bits = [3, 0], grade = "established" }

[[words.STATS_CTL.tests]]
value = 0x88000000
expect = { fixed_mid = 1, fixed_top = 1 }

[words.STRAP]
width = 32
grade = "inferred"

[words.STRAP.fields]
board_rev = { bits = [27, 24], grade = "established" }
command_level = { bits = [15, 7], grade = "inferred" }
display_level = { bits = [6, 0], grade = "established" }

[words.STRAP.fields.sdram_size]
bits = [31, 30]
grade = "established"

[words.STRAP.fields.sdram_size.enums]
mb32 = { value = 0, grade = "established" }
mb64 = { value = 1, grade = "established" }
mb128 = { value = 2, grade = "established" }
mb32_alt = { value = 3, grade = "established" }

[words.STRAP.fields.banks]
bits = [29, 29]
grade = "established"

[words.STRAP.fields.banks.enums]
two = { value = 0, grade = "established" }
four = { value = 1, grade = "established" }

[words.STRAP.fields.cas]
bits = [28, 28]
grade = "established"

[words.STRAP.fields.cas.enums]
cas3 = { value = 0, grade = "established" }
cas2 = { value = 1, grade = "established" }

[[words.STRAP.tests]]
value = 0xa1000000
kind = "example"
expect = { sdram_size = 2, banks = 1, cas = 0, board_rev = 1 }

[words.WIDGET_CONTROL]
width = 32
grade = "established"

[words.WIDGET_CONTROL.fields]
credit = { bits = [15, 12], grade = "established" }
big_endian = { bits = [9, 9], grade = "established" }

[[words.WIDGET_CONTROL.tests]]
value = 0x4200
expect = { big_endian = 1, credit = 4 }

[words.WIDGET_ID]
width = 32
grade = "inferred"

[words.WIDGET_ID.fields]
variant = { bits = [31, 31], grade = "inferred" }
revision = { bits = [30, 28], grade = "inferred" }

[[words.WIDGET_ID.tests]]
value = 0xa0000000
kind = "example"
expect = { variant = 1, revision = 2 }

