regex = 'no larger than (0x8000) \(32,768\)'
binds = [
  ['DEFN', 'TEX_SIZE_MAX', 1],
]

[[claims]]
group = 'texture'
label = 'border limit'
doc = 'docs/texture-state.md'
regex = 'a border other than 0 or (\d+) makes the check'
binds = [
  ['DEF', 'TEX_BORDER_MAX', 1],
]

[[claims]]
group = 'texture'
label = 'slice exponent field'
doc = 'docs/texture-formats.md'
regex = 'Level word 2 bits (\d+):(\d+), written for 3D targets only'
binds = [
  ['F', 'LEVEL3D_W2.slice_exp', 1, 2],
]

[[claims]]
group = 'texture'
label = 'slice stride'
doc = 'docs/texture-formats.md'
regex = 'this is `\((\d+) << c\) << word 2` units'
binds = [
  ['DEF', 'TEX_SLICE_STRIDE_BASE', 1],
]

[[claims]]
group = 'texture'
label = 'tile width'
doc = 'docs/texture-formats.md'
regex = 'from the width in (\d+)-texel tiles rounded up to even'
binds = [
  ['DEF', 'TEX_TILE_TEXELS', 1],
]

[[claims]]
group = 'texture'
label = 'format index width'
doc = 'docs/texture-formats.md'
regex = 'six-bit field in bits (\d+):(\d+) of word 1'
binds = [
  ['FW', 'FMT.index', 1, 2],
]

[[claims]]
group = 'texture'
label = 'class width'
doc = 'docs/texture-formats.md'
regex = '"Class" is the (\d)-bit value'
binds = [
  ['FWD', 'CLASS.value', 1],
]

[[claims]]
group = 'texture'
label = 'size code width'
doc = 'docs/texture-formats.md'
regex = '\*\*Word 1 bits (\d+):(\d+) are the size code'
binds = [
  ['FW', 'SIZE.code', 1, 2],
]

[[claims]]
group = 'texture'
label = 'offset code width'
doc = 'docs/texture-formats.md'
regex = 'offset code \(level word 1 bits (\d+):(\d+)\)'
binds = [
  ['FW', 'OFFCODE.value', 1, 2],
]

[[claims]]
group = 'texture'
label = 'colour table width'
doc = 'docs/texture-state.md'
regex = 'a width of 0 or a power of two up to (\d+) is accepted'
binds = [
  ['DEF', 'TEX_COLTAB_MAX_WIDTH', 1],
]

[[claims]]
group = 'texture'
label = 'colour table upload targets'
doc = 'docs/texture-state.md'
regex = 'sixteen words to `(0x3e00) \+ i`.*?then sixteen to `(0x3e10) \+ i`.*?for i = 0 to (\d+)\)'
binds = [
  ['DEFN', 'TEX_COLTAB_A_BASE', 1],
  ['DEFN', 'TEX_COLTAB_B_BASE', 2],
  ['DEF', 'TEX_COLTAB_UPLOAD_LAST', 3],
]

[[claims]]
group = 'texture'
label = 'colour table lanes'
doc = 'docs/texture-state.md'
regex = 'red lane of entry n in bits (\d+):(\d+), green lane in bits (\d+):(\d+)\) and the second with word n = \(blue in (\d+):(\d+), alpha in (\d+):(\d+)\); bits (\d+):(\d+) of each word are kept'
binds = [
  ['F', 'COLTAB_A.red', 1, 2],
  ['F', 'COLTAB_A.green', 3, 4],
  ['F', 'COLTAB_B.blue', 5, 6],
  ['F', 'COLTAB_B.alpha', 7, 8],
  ['F', 'COLTAB_A.kept', 9, 10],
  ['F', 'COLTAB_B.kept', 9, 10],
]

[[claims]]
group = 'texture'
label = 'colour table entry mapping'
doc = 'docs/texture-state.md'
regex = 'words (\d+) i to \1 i \+ (\d+) of the first table.*?upload i = n >> (\d+) at word n & (\d+) of both'
binds = [
  ['DEF', 'TEX_COLTAB_UPLOAD_WORDS', 1],
  ['DEF', 'TEX_COLTAB_WORD_MASK', 2],
  ['DEF', 'TEX_COLTAB_UPLOAD_SHIFT', 3],
  ['DEF', 'TEX_COLTAB_WORD_MASK', 4],
]

[[claims]]
group = 'texture'
label = 'colour table lane conversion'
doc = 'docs/texture-state.md'
regex = '`trunc\((\d+) x \+ 0\.5\) & (0x[0-9a-f]+)`'
binds = [
  ['DEF', 'TEX_COLOUR12_ROUND_SCALE', 1],
  ['DEFN', 'TEX_COLOUR12_LANE_MASK', 2],
]

[[claims]]
group = 'texture'
label = 'colour table entries'
doc = 'docs/texture-state.md'
regex = 'never receives fewer than (\d+) entries'
binds = [
  ['DEF', 'TEX_COLTAB_ENTRIES', 1],
]

[[claims]]
