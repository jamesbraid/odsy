[project]
name = "odsy"
plugin = "scripts/odsy_checks.py"
regenerate = "retools/tools/defs/gen_decode_rust.py --config defs.toml"

[rust]
out_dir = "generated/odyssey-regs"

[banned]
allow_includes = ["stdint.h"]

[[banned.extra]]
label = "odsy symbol"
regex = '\bodsy(?:[A-Z_]\w*)'

[[banned.extra]]
label = "driver routine prefix"
regex = '\b(?:gfP_|gfx_|ody_|odsy_)\w*'

[[banned.extra]]
label = "library routine"
regex = '\b__gl\w*|\bRenderFunc\w*|\bImage(?:Chain|Xfer|Calc|Copy|ToDma)\w*'

[[banned.extra]]
label = "library routine"
regex = '\b(?:SetupDMA|MovePixels|Validate(?:Hardware|Texture)|CalcTexel|ChooseSuitable)\w*'

[[banned.extra]]
label = "kernel object name"
regex = '\b\w+_(?:tport|pon|sdram|brdmgr|pmm|ctxsw)\b'

[[banned.extra]]
label = "vendor register name"
regex = '\bsys\.config\b|\b[a-z]+\.[a-z]+_config\b'

[[banned.extra]]
label = "binary name"
regex = '\blibGL\w*|\bodyssey\.(?:a|so)\b|\bbuzz_xform\b|\bbuzz_ucode\b'

[[headers]]
file = "BUZZ_DECODE.h"
form = "legacy"
macro_pairs = [
  ["HDR_W4.class", "BUZZ_HDR_W4_CLASS_SHIFT", "BUZZ_HDR_W4_CLASS_MASK"],
  ["HDR_W4.code", "BUZZ_HDR_W4_CODE_SHIFT", "BUZZ_HDR_W4_CODE_MASK"],
  ["HDR_W4.size_field", "BUZZ_HDR_W4_SIZEFLD_SHIFT", "BUZZ_HDR_W4_SIZEFLD_MASK"],
  ["HDR_W4.pixel_size", "BUZZ_HDR_W4_PSIZE_SHIFT", "BUZZ_HDR_W4_PSIZE_MASK"],
  ["HDR_W4.field_a", "BUZZ_HDR_W4_FIELD_A_SHIFT", "BUZZ_HDR_W4_FIELD_MASK"],
  ["HDR_W4.field_b", "BUZZ_HDR_W4_FIELD_B_SHIFT", "BUZZ_HDR_W4_FIELD_MASK"],
  ["HDR_W7.format", "BUZZ_HDR_W7_FORMAT_SHIFT", "BUZZ_HDR_W7_FORMAT_MASK"],
  ["HDR_W7.type", "BUZZ_HDR_W7_TYPE_SHIFT", "BUZZ_HDR_W7_TYPE_MASK"],
  ["HDR_W7.psize", "BUZZ_HDR_W7_PSIZE_SHIFT", "BUZZ_HDR_W7_PSIZE_MASK"],
  ["TEXLEVEL_W1.format_index", "BUZZ_TEXLEVEL_W1_FMT_SHIFT", "BUZZ_TEXLEVEL_W1_FMT_MASK"],
  ["TEXLEVEL_W1.offset_code", "BUZZ_TEXLEVEL_W1_OFFS_SHIFT", "BUZZ_TEXLEVEL_W1_OFFS_MASK"],
  ["TEXLEVEL_W1.size_code", "BUZZ_TEXLEVEL_W1_SIZE_SHIFT", "BUZZ_TEXLEVEL_W1_SIZE_MASK"],
  ["ALPHA_TEST.reference", "BUZZ_ALPHA_TEST_REFERENCE_SHIFT", "BUZZ_ALPHA_TEST_REFERENCE_MASK"],
  ["FRAME_PIXEL.alpha", "BUZZ_FRAME_PIXEL_ALPHA_SHIFT", "BUZZ_FRAME_PIXEL_COMPONENT_MASK"],
  ["FRAME_PIXEL.blue", "BUZZ_FRAME_PIXEL_BLUE_SHIFT", "BUZZ_FRAME_PIXEL_COMPONENT_MASK"],
  ["FRAME_PIXEL.green", "BUZZ_FRAME_PIXEL_GREEN_SHIFT", "BUZZ_FRAME_PIXEL_COMPONENT_MASK"],
  ["FRAME_PIXEL.red", "BUZZ_FRAME_PIXEL_RED_SHIFT", "BUZZ_FRAME_PIXEL_COMPONENT_MASK"],
  ["ALPHA_TEST.func", "BUZZ_ALPHA_TEST_FUNC_SHIFT", "BUZZ_ALPHA_TEST_FUNC_MASK"],
]
inplace = [
  ["HDR_W7.type", "BUZZ_HDR_W7_TYPE_INPLACE"],
  ["TEXLEVEL_W1.pitch", "BUZZ_TEXLEVEL_W1_PITCH_MASK"],
]
group = "BUZZ_DECODE.h"
module = "buzz"
rust_prefix = "BUZZ_"
description = ["Command opcodes and the image, copy, pixel-mode, texture-level and sampler", "words of the Odyssey geometry and pixel engine's command stream."]

[headers.words]
HDR_W0 = ["ImageWord0", "Image header word 0: board reference."]
HDR_W1 = ["ImageWord1", "Image header word 1: x and y of the smaller corner."]
HDR_W2 = ["ImageWord2", "Image header word 2: the window word."]
HDR_W3 = ["ImageWord3", "Image header word 3: width and height."]
HDR_W4 = ["ReadHeader", "Image header word 4: class and code, field geometry, pixel size.\nThe read header's word 4, and the COPY source description."]
HDR_W6 = ["ImageWord6", "Image header word 6: row bytes."]
HDR_W7 = ["WriteHeader", "Image header word 7: format, type, size and path control.\nThe write header's word 7, and the COPY destination control."]
COPY_W2 = ["CopyMixed", "COPY operand 2: the two window words and the destination's second field code."]
COPY_W7 = ["CopyControl", "COPY operand 7 beyond the write header: flags set around the walk."]
PF = ["PostFilterWord", "A scale or bias word of the post-filter block."]
PIXMODE_W0 = ["PixelModeW0", "Pixel-mode descriptor, first word."]
PIXMODE_W1 = ["PixelModeW1", "Pixel-mode descriptor, second word."]
TEXLEVEL_W0 = ["TexLevelW0", "Texture level descriptor, word 0."]
TEXLEVEL_W1 = ["TexLevelW1", "Texture level descriptor, word 1."]
TEXLEVEL_W2 = ["TexLevelW2", "Texture level descriptor, word 2."]
SAMPLER = ["SamplerWord", "The sampler word: operand 4 of the texture-mode block."]

[[headers.enum_families]]
prefix = "FMT"
type = "WriteFormat"
doc = "Write header format code (bits 4:0)."
digit_prefix = "Format"
fields = ["HDR_W7.format"]

[[headers.enum_families]]
prefix = "TYPE"
type = "WriteType"
doc = "Write header type code (bits 8:5)."
digit_prefix = "Packed"
fields = ["HDR_W7.type"]

[[headers.enum_families]]
prefix = "PSIZE"
type = "PixelSize"
doc = "Pixel-size code (three bits, 18:16)."
digit_prefix = "Bytes"
fields = ["HDR_W7.psize", "HDR_W4.pixel_size"]

[[headers.enum_families]]
prefix = "FIELDFMT"
type = "FieldFormat"
doc = "Pixel-mode field format (bits 6:4)."
digit_prefix = "Format"
fields = ["PIXMODE_W1.field_format"]

[[headers.enum_families]]
prefix = "SAMPLER_MIN"
type = "SamplerMin"
doc = "Sampler minification filter (bits 7:5)."
digit_prefix = "Min"
fields = ["SAMPLER.min"]

[[headers.enum_families]]
prefix = "SAMPLER_MAG"
type = "SamplerMag"
doc = "Sampler magnification mode (bits 4:1)."
digit_prefix = "Mag"
fields = ["SAMPLER.mag"]

[[headers.enum_families]]
prefix = "SAMPLER_WRAP"
type = "SamplerWrap"
doc = "Sampler wrap mode."
digit_prefix = "Wrap"
fields = ["SAMPLER.wrap_r", "SAMPLER.wrap_t", "SAMPLER.wrap_s"]

[[headers]]
file = "DISPLAY_DECODE.h"
form = "regs"
block = "DISPLAY"
group = "display"
notes_corpus = ["docs/display.md", "docs/pbj.md", "docs/registers.md", "DISPLAY.h", "PBJ.h"]
module = "display"
rust_prefix = "DISPLAY_"
register_doc = "Display-space register"
description = ["Display-half registers of the Odyssey board: colour map, line and frame", "tables, cursor, DAC, timing generator, genlock and the display-mode table."]

[[headers]]
file = "PBJ_DECODE.h"
form = "regs"
block = "PBJ"
group = "display"
notes_corpus = ["docs/display.md", "docs/pbj.md", "docs/registers.md", "DISPLAY.h", "PBJ.h"]
module = "pbj"
rust_prefix = "PBJ_"
register_doc = "Display-space register"
description = ["Host-interface, I2C and scanout-buffer registers of the Odyssey board,", "and the header word that frames a display FIFO write."]

[[headers]]
file = "TEXTURE_DECODE.h"
form = "regs"
prefix = "TEX"
group = "texture"
notes_corpus = ["docs/texture-state.md", "docs/texture-formats.md", "docs/tokens.md", "BUZZ.h"]
module = "texture"
rust_prefix = "TEX_"
description = ["Texture state words of the Odyssey command stream: environment, mode, LOD,", "offset and target blocks, and the opcodes that carry them."]

[[headers]]
file = "DMA_DECODE.h"
form = "regs"
prefix = "DMA"
group = "dma"
notes_corpus = ["docs/kernel.md", "BUZZ.h", "docs/buzz.md", "docs/registers.md"]
no_addresses = true
size_limit_macro = "DMA_ENTRY_MAX_BYTES"
module = "dma"
rust_prefix = "DMA_"
description = ["DMA-engine descriptor words of the Odyssey board: the kick words, the", "transfer entry and its tag."]
[[headers]]
file = "ODSY_DECODE.h"
form = "regs"
prefix = "ODSY"
group = "ODSY_DECODE.h"
module = "board"
rust_prefix = "ODSY_"
description = ["Board identity on the crossbar, the register positions of the board", "window, and the identity, strap and memory-configuration words."]

[[headers]]
file = "COMPOSITOR_DECODE.h"
form = "regs"
prefix = "CCX"
group = "COMPOSITOR_DECODE.h"
module = "compositor"
rust_prefix = "CCX_"
description = ["Register numbers of the first compositor chip of a VPro compositor board,", "with access direction and default value."]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'read class/code split'
doc = 'docs/pixel-paths.md'
regex = 'class \(bits (\d+):(\d+)\) \d+, code \(bits (\d+):(\d+)\)'
binds = [
  ['F', 'HDR_W4.class', 1, 2],
  ['F', 'HDR_W4.code', 3, 4],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'read class/code split (table)'
doc = 'docs/pixel-paths.md'
regex = 'bits (\d+):(\d+) class, (\d+):(\d+) code, 12 set'
binds = [
  ['F', 'HDR_W4.class', 1, 2],
  ['F', 'HDR_W4.code', 3, 4],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'write format/type split'
doc = 'docs/pixel-paths.md'
regex = 'format code in bits (\d+):(\d+), type code in\s+bits (\d+):(\d+)'
binds = [
  ['F', 'HDR_W7.format', 1, 2],
  ['F', 'HDR_W7.type', 3, 4],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'write word 7 fields'
doc = 'docs/pixel-paths.md'
regex = 'bits (\d+):(\d+) format code, (\d+):(\d+) type code, bit (\d+) expand, bit (\d+) unpack byte swap, (\d+):(\d+) bytes-per-pixel code, bit (\d+) transfer path, bit (\d+) as for a read'
binds = [
  ['F', 'HDR_W7.format', 1, 2],
  ['F', 'HDR_W7.type', 3, 4],
  ['F', 'HDR_W7.expand', 5],
  ['F', 'HDR_W7.swap', 6],
  ['F', 'HDR_W7.psize', 7, 8],
  ['F', 'HDR_W7.transform', 9],
  ['F', 'HDR_W7.differs', 10],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 7 pixel-size code'
doc = 'docs/pixel-paths.md'
regex = 'result goes to word 7 bits (\d+):(\d+) of both'
binds = [
  ['F', 'HDR_W7.psize', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 4 pixel-size code'
doc = 'docs/pixel-paths.md'
regex = 'pixel-size code from description \+0x28'
binds = [
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 4 pixel-size width note'
doc = 'docs/pixel-paths.md'
regex = 'pixel-size code is three bits, (\d+):(\d+), in both header words'
binds = [
  ['F', 'HDR_W4.pixel_size', 1, 2],
  ['F', 'HDR_W7.psize', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 4 size field'
doc = 'docs/pixel-paths.md'
regex = '15:13 the class field'
binds = [
  ['F', 'HDR_W4.size_field'],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 1 and 3 packing'
doc = 'docs/pixel-paths.md'
regex = '\| 1 \| x in bits (\d+):(\d+), y in (\d+):(\d+)'
binds = [
  ['F', 'HDR_W1.x', 1, 2],
  ['F', 'HDR_W1.y', 3, 4],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 3 packing'
doc = 'docs/pixel-paths.md'
regex = '\| 3 \| width in bits (\d+):(\d+), height in (\d+):(\d+)'
binds = [
  ['F', 'HDR_W3.width', 1, 2],
  ['F', 'HDR_W3.height', 3, 4],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 6 row bytes'
doc = 'docs/pixel-paths.md'
regex = '\| 6 \| row bytes in bits (\d+):(\d+)'
binds = [
  ['F', 'HDR_W6.row_bytes', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'word 2 window word'
doc = 'docs/pixel-paths.md'
regex = '\| 2 \| description \+0x1c in bits (\d+):(\d+)'
binds = [
  ['F', 'HDR_W2.window_word', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'copy operand 2 packing'
doc = 'docs/pixel-paths.md'
regex = "description \\+0x1c in bits (\\d+):(\\d+), the destination\\'s second field code in bits (\\d+):(\\d+)\\s+and the source \\+0x1c in bits (\\d+):(\\d+), with destination front in bit (\\d+)"
binds = [
  ['F', 'COPY_W2.dst_window', 1, 2],
  ['F', 'COPY_W2.dst_field_b', 3, 4],
  ['F', 'COPY_W2.src_window', 5, 6],
  ['F', 'COPY_W2.dst_front', 7],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'copy operand 7 flags'
doc = 'docs/pixel-paths.md'
regex = "bits (\\d+):(\\d+) set\\s+when context \\+0x16a68 is zero \\(.*?\\), bit (\\d+) exactly when.*?bit (\\d+) when the destination y lies\\s+in the source\\'s y range and bit (\\d+) when the destination x"
binds = [
  ['F', 'COPY_W7.clamp_off', 1, 2],
  ['F', 'HDR_W7.transform', 3],
  ['F', 'COPY_W7.dst_y_in_src', 4],
  ['F', 'COPY_W7.dst_x_in_src', 5],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'pixel-mode word'
doc = 'docs/pixel-paths.md'
regex = "\\+0x96a0\\s+bits (\\d+):(\\d+) the description\\'s \\+0x1c; \\+0x96a4 bits (\\d+):(\\d+) the field format above, (\\d+):(\\d+) the layout\\s+code, (\\d+):(\\d+) the storage code, (\\d+):(\\d+) the description\\'s \\+0x28, bit (\\d+) for pixel classes 16 and\\s+17, bit (\\d+) when"
binds = [
  ['F', 'PIXMODE_W0.window_word', 1, 2],
  ['F', 'PIXMODE_W1.field_format', 3, 4],
  ['F', 'PIXMODE_W1.layout', 5, 6],
  ['F', 'PIXMODE_W1.storage', 7, 8],
  ['F', 'PIXMODE_W1.size_field', 9, 10],
  ['F', 'PIXMODE_W1.index_class', 11],
  ['F', 'PIXMODE_W1.bit27', 12],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor format index'
doc = 'docs/texture-formats.md'
regex = 'six-bit field in bits (\d+):(\d+) of word 1 of a level descriptor'
binds = [
  ['F', 'TEXLEVEL_W1.format_index', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor size code'
doc = 'docs/texture-formats.md'
regex = '\*\*Word 1 bits (\d+):(\d+) are the size code'
binds = [
  ['F', 'TEXLEVEL_W1.size_code', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor offset code'
doc = 'docs/texture-formats.md'
regex = 'offset code \(level word 1 bits (\d+):(\d+)\)'
binds = [
  ['F', 'TEXLEVEL_W1.offset_code', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor pitch'
doc = 'docs/texture-formats.md'
regex = 'Word 1 bits (\d+):(\d+) come from the width in 16-texel tiles'
binds = [
  ['F', 'TEXLEVEL_W1.pitch', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor word 0'
doc = 'docs/texture-state.md'
regex = '\| `__glOdysseyTextureActivate` \| bits (\d+):(\d+) '
binds = [
  ['F', 'TEXLEVEL_W0.addr', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler wrap fields'
doc = 'docs/texture-state.md'
regex = 'Word 4 field \(S bits (\d+):(\d+), T (\d+):(\d+), R (\d+):(\d+)\)'
binds = [
  ['F', 'SAMPLER.wrap_s', 1, 2],
  ['F', 'SAMPLER.wrap_t', 3, 4],
  ['F', 'SAMPLER.wrap_r', 5, 6],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler table format and bit 0'
doc = 'docs/texture-formats.md'
regex = '\| Table format code \| (\d+):(\d+) \|'
binds = [
  ['F', 'SAMPLER.table_fmt', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler colour table enable'
doc = 'docs/texture-formats.md'
regex = '\| Colour-table enable \| (\d+) \|'
binds = [
  ['F', 'SAMPLER.colour_table', 1],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler image flag'
doc = 'docs/texture-formats.md'
regex = '\| Image-step flag \| (\d+) \|'
binds = [
  ['F', 'SAMPLER.image_flag18', 1],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler min filter'
doc = 'BUZZ.h'
regex = 'Bits (\d+):(\d+): minification filter'
binds = [
  ['F', 'SAMPLER.min', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler mag filter'
doc = 'BUZZ.h'
regex = 'Bits (\d+):(\d+): magnification filter'
binds = [
  ['F', 'SAMPLER.mag', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler trilinear'
doc = 'BUZZ.h'
regex = '/\* Bit (\d+): set for GL_LINEAR_MIPMAP_LINEAR'
binds = [
  ['F', 'SAMPLER.trilinear', 1],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler no-offset'
doc = 'BUZZ.h'
regex = "/\\* Bit (\\d+): set when the object\\'s offset flag"
binds = [
  ['F', 'SAMPLER.no_offset', 1],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'sampler activation'
doc = 'BUZZ.h'
regex = '/\* Bits (\d+):(\d+): 3-bit value from the current-texture lookup'
binds = [
  ['F', 'SAMPLER.activation', 1, 2],
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'post-filter word format'
doc = 'BUZZ.h'
regex = 'Each is signed 3\.12 in (\d+) bits'
binds = [
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'COPY opcode'
doc = 'docs/pixel-paths.md'
regex = 'sends 0x2031 and the eight words'
binds = [
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'POSTFILTER opcode'
doc = 'docs/pixel-paths.md'
regex = '`0x0001203b` and the eight words'
binds = [
]

[[claims]]
group = 'BUZZ_DECODE.h'
label = 'level descriptor opcode'
doc = 'docs/buzz.md'
regex = 'header `0x10e80 \| i`|word `0x00010ebc`|0x280 \+ i'
binds = [
]

[[claims]]
group = 'display'
label = 'colour map channels'
doc = 'docs/display.md'
regex = 'R in bits (\d+):(\d+), G in (\d+):(\d+), B in (\d+):(\d+)'
binds = [
  ['F', 'DISPLAY.cmap.r', 1, 2],
  ['F', 'DISPLAY.cmap.g', 3, 4],
  ['F', 'DISPLAY.cmap.b', 5, 6],
]

[[claims]]
group = 'display'
label = 'cursor colour channels'
doc = 'docs/display.md'
regex = 'colour-table entry is three 10-bit fields at (\d+):(\d+), (\d+):(\d+) and (\d+):(\d+)'
binds = [
  ['F', 'DISPLAY.cursor_colors.r', 1, 2],
  ['F', 'DISPLAY.cursor_colors.g', 3, 4],
  ['F', 'DISPLAY.cursor_colors.b', 5, 6],
]

[[claims]]
group = 'display'
label = 'colour map extent'
doc = 'docs/pbj.md'
regex = 'so entries (0) to (0x[0-9a-f]+) exist'
binds = [
  ['O', 'DISPLAY.cmap', 1],
  ['E', 'DISPLAY.cmap', 2],
]

[[claims]]
group = 'display'
label = 'frame and line table'
doc = 'docs/display.md'
regex = 'frame table lives at display address (0x[0-9a-f]+) \(up to (\d+) entries\) and the line table at (0x[0-9a-f]+) \(up to (\d+) entries\)'
binds = [
  ['O', 'DISPLAY.frame_table', 1],
  ['C', 'DISPLAY.frame_table', 2, 2],
  ['O', 'DISPLAY.line_table', 3],
  ['C', 'DISPLAY.line_table', 4, 2],
]

[[claims]]
group = 'display'
label = 'table entry packing'
doc = 'docs/display.md'
regex = 'word = e\[2k\] \| e\[2k\+1\] << (\d+)'
binds = [
  ['LO', 'DISPLAY.line_table.e1_end', 1, 15],
  ['LO', 'DISPLAY.line_table.e1_duration', 1, 8],
  ['LO', 'DISPLAY.line_table.e1_levels', 1, 0],
  ['LO', 'DISPLAY.frame_table.repeat', 1, 0],
]

[[claims]]
group = 'display'
label = 'line entry end flag'
doc = 'docs/display.md'
regex = 'run of 16-bit entries whose last has bit (\d+) set'
binds = [
  ['F', 'DISPLAY.line_table.e0_end', 1],
]

[[claims]]
group = 'display'
label = 'line entry duration'
doc = 'docs/display.md'
regex = 'bits (\d+):(\d+) are a duration in pixel clocks for timed entries and bits (\d+):(\d+) the output states'
binds = [
  ['F', 'DISPLAY.line_table.e0_duration', 1, 2],
  ['F', 'DISPLAY.line_table.e0_levels', 3, 4],
]

[[claims]]
group = 'display'
label = 'init-state blank bit'
doc = 'docs/pbj.md'
regex = 'shadow that `odsyBlankScreen` clears bit (\d+) of'
binds = [
  ['F', 'DISPLAY.vtg_init_state.blank_gate', 1],
]

[[claims]]
group = 'display'
label = 'channel-enable blank bits'
doc = 'docs/pbj.md'
regex = 'clears the three bits of mask (0x[0-9a-f]+) in it'
binds = [
  ['M', ['DISPLAY.vtg_chan_en.blank_gate_5', 'DISPLAY.vtg_chan_en.blank_gate_1', 'DISPLAY.vtg_chan_en.blank_gate_0'], 1],
]

[[claims]]
group = 'display'
label = 'timing control locked bit'
doc = 'PBJ.h'
regex = '0x2481 bit (\d+) is set while locked'
binds = [
  ['F', 'DISPLAY.vtg_ctl.locked', 1],
]

[[claims]]
group = 'display'
label = 'cursor position and control'
doc = 'docs/display.md'
regex = '(0x[0-9a-f]+) is the cursor position, (0x[0-9a-f]+) the control word'
binds = [
  ['O', 'DISPLAY.cursor_pos', 1],
  ['O', 'DISPLAY.cursor_ctl', 2],
]

[[claims]]
group = 'display'
label = 'cursor image blocks'
doc = 'docs/display.md'
